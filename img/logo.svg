<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Los Soprano">
  <defs>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfc9c0"/>
    </linearGradient>
  </defs>

  <!-- Wordmark -->
  <text x="0" y="34"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="700" letter-spacing="4"
        fill="url(#brillo)">LOS SOP<tspan fill="#b3122b">R</tspan>ANO</text>

  <!-- Línea + bajada -->
  <rect x="1" y="44" width="46" height="2" fill="#b3122b"/>
  <text x="56" y="49"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="9" letter-spacing="4.5" fill="#a09b93">SITIO DE FANS</text>
</svg>
